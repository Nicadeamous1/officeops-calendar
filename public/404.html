<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#09111f" />
    <title>OfficeOps Calendar</title>
    <script>
      const base = '/officeops-calendar/'
      const route = window.location.pathname.slice(base.length - 1)
      window.location.replace(base + '?route=' + encodeURIComponent(route || '/') + window.location.hash)
    </script>
    <style>
      body { margin: 0; background: #09111f; color: #e6edf7; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>Loading OfficeOps...</body>
</html>
